<!DOCTYPE html>
<html>
<head>
    <title>Job</title>

    <style>
        .jobs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 150px 200px;
            gap: 20px;
        }

        .job {
            border: 2px solid black;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="jobs">
        <div class="job">Python Developer</div>
        <div class="job">Data Analyst</div>
        <div class="job">Frontend Developer</div>
        <div class="job">Backend Developer</div>
        <div class="job">UI Designer</div>
        <div class="job">Software Engineer</div>
    </div>

</body>
</html>
