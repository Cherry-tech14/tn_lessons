<!DOCTYPE html>
<html>
<head>
    <title>Align Items</title>

    <style>
        .container {
            display: flex;
            height: 200px;
            border: 2px solid black;
            justify-content: center;
            align-items: center;
        }

        .box {
            padding: 20px;
            border: 2px solid blue;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
