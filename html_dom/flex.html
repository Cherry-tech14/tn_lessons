<!DOCTYPE html>
<html>
<head>
    <title>Flex Wrap</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap-reverse;
            width: 400px;
        }

        .box {
            width: 150px;
            padding: 20px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </div>

</body>
</html>
