<!DOCTYPE html>
<html>
    <head>
        <title>Justify Content</title>
        <style>
            .container {
                display: flex;
                justify-content: space-between;
                
            }
            .box {
                padding: 20px;
                border: 2px solid red;
            }
        </style>
    </head>
    <body>
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>
        
    </body>
</html>
