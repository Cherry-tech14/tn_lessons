<!DOCTYPE html>
<html>
    <head>
        <title>Flex Direction</title>
        <style>
            .container {
                display: flex;
                flex-direction: column-reverse;
            }
            .box {
                padding: 20px;
                border: 2px solid black;
            }
        </style>
    </head>
    <body>
          <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
    </body>
</html>
