<!--Using ~ to select element-->
<!DOCTYPE html>
<html>
<head>
    <title>General Sibling Selector</title>

    <style>
        h2 ~ p {
            color: blue;
        }
    </style>
</head>

<body>

    <div>
        <h2>My Website</h2>

        <p>First paragraph</p>
        <p>Second paragraph</p>
        <p>Third paragraph</p>
    </div>

</body>
</html>
