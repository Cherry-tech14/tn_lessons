<!DOCTYPE html>
<html>
    <head>
        <title>Adjacent Sibling</title>
        <style>
            h2 + p {
                color: blue
            }
        </style>
    </head>
    <body>
        <div>
            <h2>My Website</h2>
            <p>This paragraph comes immediately after the heading</p>
            <p>This paragraph does not</p>
        </div>
    </body>
</html>
